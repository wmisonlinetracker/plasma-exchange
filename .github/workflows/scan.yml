name: Scan competitor prices and update website

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours (UTC). For once a day use: "17 6 * * *"
  workflow_dispatch:             # adds a "Run workflow" button for an instant scan
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/**"]

permissions:
  contents: write                # save the price history back into the repository
  pages: write
  id-token: write

concurrency:
  group: price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan competitor prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_EXCLUDE_SELLERS: ${{ vars.EBAY_EXCLUDE_SELLERS }}
        run: |
          mkdir -p data
          python app/market.py --db data/market.db scrape

      - name: Build website
        run: python app/build_site.py --db data/market.db --out site --archive data/roundups

      - name: Save price history
        run: |
          git config user.name "plasma-exchange-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Price scan $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "No changes"
          git pull --rebase --autostash || true
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
